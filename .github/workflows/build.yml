name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: SMAPILoader
      - uses: actions/checkout@v4
        with:
          repository: NRTnarathip/SMAPI-Android-1.6
          path: SMAPI-Android-1.6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: SMAPILoader/global.json
      - name: Install Android workload
        working-directory: SMAPILoader
        run: dotnet workload install android
      - name: Make debug keystore if missing
        working-directory: SMAPILoader/SMAPIGameLoader
        run: |
          [ -f debug.keystore ] || keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build
        working-directory: SMAPILoader/SMAPIGameLoader
        run: dotnet build -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: SMAPILoader/SMAPIGameLoader/bin/Release/**/*.apk
